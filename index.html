<!-- ============ 导航栏 ============ -->

    <li><a href="#works"  data-nav><span class="num">02</span><span data-i18n="nav_work">作品集</span></a></li>

<!-- 移动端全屏菜单 -->
<div id="mobile-menu">

    <div class="page-content">
      <p class="section-label" id="home-label">DONGCANGSWORD // 东仓刀</p>

      <p class="home-sub"><span class="rotating" id="rotating-text">移动端开发</span></p>
      <div class="home-meta">
        <span>🕒 <span class="value" id="clock">--:--:--</span></span>
        <span>BUILD <span class="value" id="build-version">DCS_4.0.0</span></span>
      </div>
    </div>
  </div>

  <div id="page-works" class="page-container" data-page="works">
    <p class="section-label">02</p>
    <h2 class="section-title" data-i18n="work_title">精选项目</h2>
    <p class="section-desc" data-i18n="work_desc">移动端与网页领域的实践探索</p>

  </div>

    <div class="section-label" data-i18n="gallery_label">03 · 照片墙</div>

    <p class="section-desc" data-i18n="gallery_desc">快门与像素收集的片段。</p>
    <div id="gallery-grid" class="gallery-grid"></div>
  </section>

  <div id="page-about" class="page-container" data-page="about">
    <p class="section-label">04</p>
    <h2 class="section-title" data-i18n="about_title">关于东仓刀</h2>
    <div class="about-grid">
      <div class="about-text" id="about-text"></div>
      <div class="about-contacts" id="about-contacts"></div>
    </div>
  </div>

</main>
